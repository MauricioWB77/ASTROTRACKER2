<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Descoberta | AstroTracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>ASTROTRACKER</h1>
        <div>
            <span id="boasVindas"></span>
            <button type="button" id="btnSair">Sair</button>
        </div>
    </header>

    <main>

        <section>
            <h2>Registrar nova descoberta</h2>

            <form id="formDescoberta">

                <label for="nome_rocha">Nome da rocha</label>
                <input type="text" id="nome_rocha" maxlength="100" required>

                <div class="linha">
                    <div>
                        <label for="local_descoberta">Local da descoberta</label>
                        <input type="text" id="local_descoberta" maxlength="150" required>
                    </div>
                    <div>
                        <label for="peso_kg">Peso (kg)</label>
                        <input type="number" id="peso_kg" step="0.001" min="0.001" required>
                    </div>
                </div>

                <label for="descricao">Descrição (opcional)</label>
                <textarea id="descricao" rows="3"></textarea>

                <label for="foto">Foto da rocha (JPG, PNG ou WEBP, até 5 MB)</label>
                <input type="file" id="foto" accept="image/jpeg,image/png,image/webp" required>

                <button type="submit" class="botao" id="btnEnviar">Registrar descoberta</button>

                <div id="mensagem"></div>

            </form>
        </section>

        <section>
            <h2>Minhas descobertas</h2>
            <div id="lista"></div>
        </section>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
