<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Criar conta</h1>

            <p class="subtitulo">
                Cadastre seus dados
            </p>


            <form id="formCadastro">

                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        minlength="6"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite novamente"
                        minlength="6"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="perfil">
                        Quero me cadastrar como
                    </label>

                    <select id="perfil" required>
                        <option value="cacador">Caçador de meteoritos</option>
                        <option value="comprador">Comprador (colecionador, museu ou universidade)</option>
                    </select>

                </div>


                <button type="submit">

                    Criar conta

                </button>


                <div
                    id="mensagem"
                    class="mensagem"
                ></div>

            </form>


            <div class="cadastro-link">

                Já possui uma conta?

                <a href="login.html">
                    Voltar para login
                </a>

            </div>

        </div>

    </div>


    <script src="cadastro.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
