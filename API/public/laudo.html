<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laudo Geológico | AstroTracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>ASTROTRACKER</h1>
        <div>
            <span id="boasVindas"></span>
            <button type="button" id="btnSair">Sair</button>
        </div>
    </header>

    <main>

        <section>
            <h2>Descobertas aguardando seu laudo</h2>
            <p>
                Seu voto é independente: você não vê o voto do outro geólogo.
                Uma peça só vai para o leilão se dois geólogos diferentes a aprovarem.
            </p>
            <div id="pendentes"></div>
        </section>

        <section>
            <h2>Meus laudos</h2>
            <div id="meusLaudos"></div>
        </section>

    </main>

    <script src="laudo.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
