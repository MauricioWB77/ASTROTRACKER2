<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Bem-vindo</h1>

            <p class="subtitulo">
                Acesse sua conta
            </p>


            <form id="formLogin">

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="btnLogin"
                >
                    Entrar
                </button>


                <div
                    id="mensagem"
                    class="mensagem"
                ></div>

            </form>


            <div class="cadastro-link">

                Ainda não possui cadastro?

                <a href="cadastro.html">
                    Criar conta
                </a>

            </div>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
